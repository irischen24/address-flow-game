{q:'DNS 的主要功能是什麼？',o:['把網域名稱解析成 IP 位址等資訊','加密網頁內容','設計網頁樣式'],a:0,e:'DNS 負責將網域名稱對應到 IP 位址等記錄。'},
{q:'DNS 快取在有效期限內命中時，通常會怎樣？',o:['仍必須重新問根 DNS','可直接使用已保存的結果','網站會變成 404'],a:1,e:'快取有有效時間；未過期且命中時可省下重複查詢，實際行為依快取位置與解析器而定。'},
{q:'TCP 三向交握的順序是？',o:['SYN → SYN-ACK → ACK','ACK → SYN → SYN-ACK','SYN-ACK → SYN → ACK'],a:0,e:'客戶端送 SYN，伺服器回 SYN-ACK，客戶端再送 ACK。'},
{q:'TCP 三向交握的目的是？',o:['建立 TCP 連線','傳送完整的 HTML 網頁','把網域轉成 IP'],a:0,e:'三向交握只建立連線，網頁內容是之後由 HTTP 傳送。'},
{q:'HTTP/1.1 請求中的 Host 標頭用來？',o:['指出要請求的主機名稱','設定文字顏色','表示 TCP 序號'],a:0,e:'HTTP/1.1 以 Host 標頭告知伺服器目標主機。'},
{q:'404 Not Found 屬於哪一類狀態碼？',o:['4xx 用戶端錯誤類別','2xx 成功','5xx 伺服器端錯誤類別'],a:0,e:'404 表示找不到資源，屬於 4xx；不一定是使用者操作錯誤。'},
{q:'DOM 與 CSSOM 分別來自哪裡？',o:['HTML 解析、CSS 解析','CSS 解析、HTML 解析','兩者都只來自 JavaScript'],a:0,e:'HTML 解析後形成 DOM，CSS 解析後形成 CSSOM。'},

function quiz(){M='quiz';let i=0,sc=0,wr=[];const qs=QZ.slice().sort(()=>Math.random()-.5);nextQ();
 function nextQ(){if(i>=qs.length)return res();const q=qs[i],o=q.o.map((t,k)=>({t,ok:k==q.a})).sort(()=>Math.random()-.5),fb=E('p',''),nb=B(i==qs.length-1?'看結果':'下一題',()=>{i++;nextQ()});nb.hidden=true;
  const bs=o.map(x=>B(x.t,()=>{bs.forEach(b=>b.disabled=true);if(x.ok){sc++;fb.textContent='答對了！'+q.e}else{wr.push(q);fb.textContent='答錯了。正確答案：'+q.o[q.a]+'。'+q.e}snd(x.ok?'ok':'i');nb.hidden=false}));
  show([E('h3','知識測驗 '+(i+1)+'／'+qs.length),E('p',q.q),...bs.map(b=>{const d=E('div');d.append(b);return d}),fb,nb])}
 function res(){S.qz={best:Math.max(sc,S.qz?S.qz.best:0),last:sc};save();show([E('h2','測驗結果：'+sc+'／'+qs.length+' 分'),...(wr.length?[E('p','答錯題目與解析：'),...wr.map(q=>E('p','‧'+q.q+'\n答案：'+q.o[q.a]+'\n'+q.e,{className:'pl'}))]:[E('p','全部答對！你已能用自己的話說出輸入網址後的完整流程。')]),B('再挑戰一次',quiz),B('回到結局',showEnd)])}}
/* ---------- 輸入 ---------- */
const hold=(d,on)=>{held=held.filter(k=>k!=d);if(on)held.push(d)};
const KD={ArrowUp:'u',w:'u',W:'u',ArrowDown:'d',s:'d',S:'d',ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r'};
addEventListener('keydown',e=>{const k=e.key;
 if(KD[k]){if(M=='play'||M=='talk'){e.preventDefault();if(!e.repeat)hold(KD[k],1)}return}
 if([' ','Enter','e','E'].includes(k)){if(M=='play'||M=='talk'){e.preventDefault();if(!e.repeat)press()}return}
 if(k=='Escape'){if(M=='play')openPause();else if(M=='pause')resume();return}
 if(M=='talk'&&/^[1-4]$/.test(k)){const b=$('#dc').children[k-1];if(b)b.click()}});
addEventListener('keyup',e=>{if(KD[e.key])hold(KD[e.key],0)});
addEventListener('blur',()=>{held=[]});
addEventListener('pagehide',()=>{if(S&&M!='title')save()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){held=[];if(M=='play')openPause()}});
document.addEventListener('click',e=>{if(e.target.tagName=='BUTTON'&&e.target.closest('#dlg,#ov'))e.target.blur()});
document.addEventListener('contextmenu',e=>{if(e.target.closest('#ctl,#cv'))e.preventDefault()});
document.querySelectorAll('#dp button').forEach(b=>{const d=b.dataset.d;
 b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(x){}hold(d,1)});
 ['pointerup','pointercancel','lostpointercapture'].forEach(v=>b.addEventListener(v,()=>hold(d,0)))});
$('#ba').addEventListener('pointerdown',e=>{e.preventDefault();press()});
$('#bm').addEventListener('pointerdown',e=>{e.preventDefault();if(M=='play')openPause();else if(M=='pause')resume()});
$('#dlg').addEventListener('click',()=>{if(M=='talk'&&!$('#dc').childElementCount)nx()});
/* ---------- 啟動 ---------- */
S=load()||fresh();title();requestAnimationFrame(loop);
